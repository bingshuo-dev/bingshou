<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰朔安全 - 发布页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:#121622;color:#e6edf7;padding:40px 20px;min-height:100vh}
        .container{max-width:700px;margin:0 auto}
        .card{background:#1c2436;border-radius:14px;padding:32px;border:1px solid #2c3854;box-shadow:0 8px 30px #00000040}
        h1{text-align:center;color:#73b8ff;margin-bottom:12px;font-size:28px}
        .desc{text-align:center;color:#a0b4d8;margin-bottom:30px;line-height:1.6}
        .info-block{background:#151b2b;padding:16px;border-radius:10px;margin-bottom:24px}
        .info-block h3{color:#8ac2ff;margin-bottom:8px;font-size:16px}
        .info-block p{color:#b4c5e2;line-height:1.5;font-size:14px}
        .download-btn{display:block;text-align:center;background:#333b4f;color:#b4c5e2;text-decoration:none;padding:14px;border-radius:10px;font-size:17px;font-weight:bold;margin:20px 0;cursor:not-allowed}
        .notice{background:#2b2118;border:1px solid #504028;padding:14px;border-radius:10px;color:#ffd386;font-size:14px;line-height:1.5}
        .footer{margin-top:30px;text-align:center;color:#647899;font-size:13px}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>冰朔安全</h1>
            <p class="desc">自研安卓应用 | 在线公告，无需整包更新</p>

            <div class="info-block">
                <h3>版本介绍</h3>
                <p>冰朔安全，面向安卓设备的安全工具。支持在线读取公告，修改公告内容不用重新打包APK。</p>
            </div>

            <div class="info-block">
                <h3>下载</h3>
                <p>项目开发中，安装包暂未发布</p>
            </div>

            <span class="download-btn">敬请期待</span>

            <div class="notice">
                ⚠️ 公告说明：程序联网读取远程json公告，更新公告只需要修改线上json文件，不用发新版安装包。
            </div>
        </div>
        <div class="footer">冰朔安全 · 静态发布页</div>
    </div>
</body>
</html>
